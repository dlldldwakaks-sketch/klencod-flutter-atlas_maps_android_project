<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>أطلس | الخرائط</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div><strong>أطلس</strong><small>خرائطك في مكان واحد</small></div><button id="locate">📍 موقعي</button></header>
<div class="search"><input id="query" placeholder="ابحث عن مدينة أو مكان..." autocomplete="off"><button id="searchBtn">بحث</button></div>
<div class="layers">
<button class="active" data-layer="street">🗺️ عادية</button>
<button data-layer="satellite">🛰️ أقمار صناعية</button>
<button data-layer="dark">🌙 داكنة</button>
</div>
<div id="status" role="status">حرّك الخريطة أو ابحث عن مكان</div>
<div id="map"></div>
<footer><span>اضغط على الخريطة لاختيار نقطة</span><button id="routeBtn">🚗 اتجاهات</button></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body></html>
